<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración de RH - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <h2 class="fw-bold">Recursos Humanos</h2>
                    </div>
                </section>

                <!-- SECCIÓN DE CARDS RESUMEN -->
                <section id="rh-resume">
                    <div class="container">
                        <div id="rh-resume-container" class="row row-cols-1 row-cols-md-2">
                            <div class="col-6 col-lg-3">
                                <a href="/app/catalog/staff.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold card-text">EMPLEADOS</p>
                                            <i class="bi bi-person icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-qty ms-3">
                                            <p id="staff-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold card-text">ASISTENCIA</p>
                                            <i class="bi bi-person-check icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-qty ms-3">
                                            <p id="present-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>  
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold card-text">AUSENCIA</p>
                                            <i class="bi bi-person-x icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-qty ms-3">
                                            <p id="absence-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./permissions.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold card-text">PERMISOS</p>
                                            <i class="bi bi-file-earmark-diff icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-qty ms-3">
                                            <p id="request-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>        
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE ACCESOS DIRECTOS Y ESTADISTICAS GENERALES -->
                <section id="rh-menu">
                    <div class="container">
                        <div class="row flex-column-reverse flex-lg-row">
                            <div id="info-container" class="col-lg-3">
                                <div id="direct-access-container" class="p-4">
                                    <h6 class="text-muted fw-bold ps-2">ACCESOS DIRECTOS</h6>
                                    <div id="access-cards" class="row row-cols-1 g-3 pt-2">
                                        <div class="alert alert-info">
                                            No hay accesos para mostrar
                                        </div>
                                    </div>
                                </div>
                                <div id="week-container" class="p-4 mt-3">
                                    <div class="d-flex align-items-center px-1 px-md-3">
                                        <p class="fw-bold card-text">SEMANA</p>
                                        <i class="bi bi-calendar2-date icon-md ms-auto"></i>
                                    </div>
                                    <div class="card-qty ms-3">
                                        <p id="week-text" class="general-report-cant text-muted">-</p>
                                    </div>
                                </div>
                            </div>
                            <div id="graphic-container" class="col-lg-9 mb-5 mb-lg-0">
                                <div class="row row-cols-1 h-100">
                                    <div class="col-12">
                                        <div id="graphic-departament-container" class="h-100 d-flex align-items-center justify-content-center p-4">
                                            <div class="alert alert-info">
                                                No hay información para mostrar (Empleados por Departamento)
                                            </div>
                                        </div>   
                                    </div>
                                    <div class="col-12 mt-3">
                                        <div id="graphic-attendance-container" class="h-100 d-flex align-items-center justify-content-center p-4">
                                            <div class="alert alert-info">
                                                No hay información para mostrar (Asistencia)
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> 
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/modules/rrhh/pages/dashboard.js"></script>
</body>
</html>
