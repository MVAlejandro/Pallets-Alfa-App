<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <div class="row">
                            <div class="col-8 col-md-9 col-lg-9 d-flex align-items-center">
                                <h2 class="fw-bold">Gestión del Personal</h2>
                            </div>
                            <div class="col-4 col-md-3 col-lg-3 d-flex align-items-center justify-content-end d-none" data-permission="empleados.crear">
                                <button id="btn-add-staff" class="btn btn-primary d-flex align-items-center">
                                    <i class="bi bi-plus-square icon-md"></i>
                                    <p class="ps-3">Nuevo Empleado</p>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE FILTROS -->
                <section id="staff-filter">
                    <div id="staff-filter-container" class="container pt-4 pb-3">
                        <form id="filter-form" autocomplete="off">
                            <div class="row">
                                <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter-sm">
                                    <label for="search-filter" class="form-label m-2">Buscar por Empleado</label>
                                    <input id="search-filter" class="form-control" type="search" placeholder="Buscar..." aria-label="Search"/>
                                </div>
                                <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter-sm">
                                    <label for="departament-filter" class="form-label m-2">Filtrar por Depto</label>
                                    <select class="form-select" id="departament-filter">
                                        <option value="0">Todos</option>
                                    </select>
                                </div>
                                <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter-sm">
                                    <label for="status-filter" class="form-label m-2">Filtrar por Estado</label>
                                    <select class="form-select" id="status-filter">
                                        <option value="0">Todos</option>
                                        <option value="ACTIVO" selected>Activos</option>
                                        <option value="INACTIVO">Inactivos</option>
                                    </select>
                                </div>
                                <div class="col-md d-flex align-items-center justify-content-end filter-md">
                                    <button id="clear-filters" type="button" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                                        <i class="bi bi-filter-circle"></i>
                                        <p class="ps-2">Limpiar</p>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- SECCIÓN DE REGISTROS -->
                <section id="staff-register" class="mt-1">
                    <div class="container pb-3">
                        <div class="row">
                            <div class="col-8 col-md-6 d-flex align-items-center">
                                <h5>Listado de Empleados</h5>
                            </div>
                            <div class="col-4 col-md-6 d-flex align-items-center justify-content-end">
                                <p id="total-text" class="fw-bold">Total Registros: -</p>
                            </div>
                        </div>
                    </div>
                    <div class="container">
                        <div class="row">
                            <div id="staff-info" class="col-lg-4 pb-3 ps-lg-0">
                                <div id="staff-list-container" class="container p-4">
                                    <div id="staff-list" class="list-group">
                                        <p>No hay registros que mostrar</p>
                                    </div>
                                </div>
                            </div>
                            <div id="staff-details" class="col-lg-8 pb-3 pe-lg-0">
                                <div id="staff-details-container" class="container d-flex justify-content-center align-items-center p-5">
                                    <div id="logo-details" class="text-center">
                                        <h5 class="fw-light mb-4">Seleccione un empleado para visualizar su información.</h5>
                                        <img src="/assets/images/logo-letras-420x187.png" alt="Logo Pallets Alfa" class="w-75 img-fluid">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/modules/catalog/pages/staff.js"></script>
</body>
</html>
