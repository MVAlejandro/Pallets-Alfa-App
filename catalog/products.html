<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <div class="row">
                            <div class="col-8 col-md-9 col-lg-9 d-flex align-items-center">
                                <h2 class="fw-bold">Gestión de Productos</h2>
                            </div>
                            <div class="col-4 col-md-3 col-lg-3 d-flex align-items-center justify-content-end">
                                <button id="btn-add-product" class="btn btn-primary d-flex align-items-center">
                                    <i class="bi bi-plus-square icon-md"></i>
                                    <p class="ps-3">Añadir Producto</p>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
                <div id="products-form">
                    
                </div>

                <!-- SECCIÓN DE FILTROS -->
                <section id="products-filter">
                    <div id="products-filter-container" class="container pt-4 pb-3">
                        <form id="filter-form" autocomplete="off">
                            <div class="row">
                                <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter-sm">
                                    <label for="store-filter" class="form-label m-2">Filtrar por Almacén</label>
                                    <select class="form-select" id="store-filter">
                                        <option value="0">Todos</option>
                                    </select>
                                </div>
                                <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter-sm">
                                    <label for="search-filter" class="form-label m-2">Buscar por producto</label>    
                                    <input id="search-filter" class="form-control" type="search" placeholder="Buscar..." aria-label="Search"/>
                                </div>
                                <div class="col-md d-flex align-items-center justify-content-end">
                                    <button id="filter-btn" type="submit" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                                        <i class="bi bi-search"></i>
                                        <p class="ps-2">Filtrar</p>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- SECCIÓN DE REGISTROS -->
                <section id="products-register" class="mt-1">
                    <div class="container pb-3">
                        <h5>Listado de Productos</h5>
                    </div>
                    <div class="container table-responsive p-0">
                        <table id="products-table" class="table table-hover align-middle">
                            <thead>
                                <tr class="table-secondary">
                                    <th class="p-3 ps-4">CÓDIGO</th>
                                    <th class="p-3">NOMBRE</th>
                                    <th class="p-3">ALMACÉN</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- SECCIÓN DE PAGINACIÓN -->
                <section id="products-pages" class="pb-4">
                    <div id="products-pages-container" class="container pt-3 pb-3">
                        <div class="row align-items-center ms-2 me-1">
                            <div class="col-12 col-md-6 col-lg-9 mb-2">
                                <p id="products-pages-results"></p>
                            </div>
                            <div class="col-12 col-md-6 col-lg-3 d-flex justify-content-end">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <i class="bi bi-pencil-square icon-md" style="color:var(--primary)"></i>
                            </div>
                            <h5 class="modal-title fw-bold" id="edit-modalLabel">Editar Producto</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="product-edit-form" autocomplete="off">
                            <input type="hidden" id="edit-id-product">
                            <!-- Campos editables -->
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-8 label-over-border mb-4 mb-md-0">
                                    <label for="edit-name" class="form-label m-2">Nombre</label>
                                    <input type="text" class="form-control" id="edit-name">
                                    <p class="error invalid-feedback" id="error-editName" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-code" class="form-label m-2">Código</label>
                                    <input type="text" class="form-control" id="edit-code">
                                    <p class="error invalid-feedback" id="error-editCode" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 label-over-border mb-4 mb-md-0">
                                    <label for="edit-store" class="form-label m-2">Almacén</label>
                                    <input type="text" class="form-control" id="edit-store" disabled>
                                </div>
                                <div class="col-md-8 label-over-border">
                                    <label for="edit-description" class="form-label m-2">Descripción</label>
                                    <input type="text" class="form-control" id="edit-description">
                                    <p class="error invalid-feedback" id="error-editDescription" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer mx-md-4">
                    <button id="btn-asign-store" type="button" class="btn btn-secondary me-md-auto" data-bs-target="#asign-stores" data-bs-toggle="offcanvas">Almacenes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="btn-edit-entry" type="submit" form="product-edit-form" class="btn btn-primary">Guardar cambios</button>
                </div>
            </div>
        </div>

        <!-- Menú lateral para la asignación de almacenes -->
        <div class="offcanvas offcanvas-end" id="asign-stores">
            <div class="offcanvas-header border-bottom">
                <div class="row">
                    <div class="col d-flex align-items-center">
                        <div class="ms-2 me-3">
                            <i class="bi bi-shop-window icon-md" style="color:var(--primary)"></i>
                        </div>
                        <h5 class="offcanvas-title fw-bold" id="asign-stores-offcanvasLabel">Asignación de Almacenes</h5>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="container px-4">
                    <p class="text-secondary">Seleccione los almacenes donde desea dar de alta el producto:</p>
                    <form id="asign-store-form" class="mt-5">
                        <input type="hidden" id="asign-id-product">
                        <div id="store-list">

                        </div>
                    </form>
                </div>
            </div>
            <div class="offcanvas-footer mx-4 p-3 border-top">
                <button id="btn-save" class="btn btn-primary me-1">Asignar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar registro -->
    <div class="modal fade" id="delete-modal" aria-hidden="true" aria-labelledby="delete-modalLabel" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content pt-3 pb-2">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <i class="bi bi-exclamation-circle icon-md" style="color:var(--redD-dark)"></i>
                            </div>
                            <h5 class="modal-title" id="delete-modalLabel">Confirmar eliminación</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body m-auto pt-4 pb-4">
                    <input type="hidden" id="delete-id-product">
                    <p>¿Está seguro de querer eliminar el registro seleccionado?</p>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                    <button id="btn-delete-entry" class="btn btn-primary">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/modules/catalog/pages/products.js"></script>
</body>
</html>
