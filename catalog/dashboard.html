<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogos - Pallets Alfa App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <h2 class="fw-bold">Catálogos de la empresa</h2>
                    </div>
                </section>

                <!-- SECCIÓN DE CARDS RESUMEN -->
                <section id="catalog-resume">
                    <div class="container">
                        <div id="catalog-resume-container" class="row row-cols-1 row-cols-md-2">
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-2 px-md-3">
                                            <p class="fw-bold text-muted">ACTIVOS</p>
                                            <i class="bi bi-gear icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="actives-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-2 px-md-3">
                                            <p class="fw-bold text-muted">CLIENTES</p>
                                            <i class="bi bi-person icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="clients-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-2 px-md-3">
                                            <p class="fw-bold text-muted">EMPLEADOS</p>
                                            <i class="bi bi-people icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="employees-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./products.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-2 px-md-3">
                                            <p class="fw-bold text-muted">PRODUCTOS</p>
                                            <i class="bi bi-boxes icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="products-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>            
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE ESTADISTICAS GENERALES -->
                <section id="catalog-statistics">
                    <div class="container">
                        <div id="catalog-statistics-container" class="row">
                            <div id="departament-report-container" class="col-lg-6">
                                <div class="card report-card mt-3">
                                    <div class="card-body d-flex align-items-center justify-content-center text-center">
                                        <div class="card-text">
                                            <p class="fw-bold">Empleados por Departamento</p>
                                        </div>
                                    </div>
                                    <div class="graphic-report-container">
                                        <div id="graphic-departament-container" class="h-100 d-flex align-items-center justify-content-center px-4 pt-2 pb-3">
                                            aa
                                        </div>
                                    </div>
                                </div>    
                            </div>
                            <div id="stores-report-container" class="col-lg-6">
                                <div class="card report-card mt-3">
                                    <div class="card-body d-flex align-items-center justify-content-center text-center">
                                        <div class="card-text">
                                            <p class="fw-bold">Productos por Almacén</p>
                                        </div>
                                    </div>
                                    <div class="graphic-report-container">
                                        <div id="graphic-stores-container" class="h-100 d-flex align-items-center justify-content-center p-4">
                                            aa
                                        </div>
                                    </div>
                                </div> 
                            </div>
                        </div>
                    </div> 
                </section>

                <section id="direct-access" class="pb-5">
                    <div class="container">
                        <h4>Accesos directos</h4>
                        <div id="direct-access-container" class="row row-cols-1 row-cols-md-2 row-cols-md-3 g-2 mt-2">
                            <div class="col col-md-6 col-lg-4">
                                <a href="./actives.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="client-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-gear icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar activos</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./clients.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="order-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-person icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar clientes</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./staff.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="ship-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-people icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar empleados</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./spares.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="ship-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-wrench icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar refacciones</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./products.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="ship-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-boxes icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar productos</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./suppliers.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="ship-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-shop icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar proveedores</p>
                                    </div>
                                </a>
                            </div>
                        </div>
