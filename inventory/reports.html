<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes de Inventario - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <div class="row">
                            <div class="col d-flex align-items-center">
                                <h2 class="fw-bold">Reportes de Inventario</h2>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE FILTROS GENERALES -->
                <section id="general-report-filter">
                    <div id="general-report-filter-container" class="container pt-4 pb-3">
                        <div class="d-flex align-items-center ms-2 mb-4">
                            <h5 id="week-title">Semana -</h5>
                        </div>
                        <form id="general-filter-form" autocomplete="off">
                            <div class="row">
                                <div class="col-lg-3 col-md-6 d-flex align-items-center label-over-border filter-sm">
                                    <label for="date-filter" class="form-label m-2">Filtrar por Fecha</label>
                                    <input type="text" id="date-filter" class="form-control" placeholder="Rango de fechas">
                                </div>
                                <div class="col-lg-3 col-md-6 d-flex align-items-center label-over-border filter-sm">
                                    <label for="period-filter" class="form-label m-2">Seleccionar Periodo</label>
                                    <select class="form-select" id="period-filter">
                                        <option value="2026">2026</option>
                                        <option value="2025">2025</option>
                                    </select>
                                </div>
                                <div class="col-md d-flex align-items-center justify-content-end filter-md">
                                    <button id="clear-filters" type="button" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                                        <i class="bi bi-filter-circle"></i>
                                        <p class="ps-2">Restablecer</p>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- SECCIÓN DE REPORTE GENERAL -->
                <section id="reports-statistics" class="mt-1">
                    <div id="report-statistics-container" class="container px-0">
                        <div class="row">
                            <div id="general-report-container" class="col-lg-3 mb-3 mb-lg-0">
                                <div class="row">
                                    <div class="col-sm-6 col-md-12">
                                        <div class="table-responsive">
                                            <table id="general-report-table" class="table table-hover align-middle mb-0">
                                                <thead>
                                                    <tr class="table-secondary">
                                                        <th class="p-2 ps-4">Concepto</th>
                                                        <th class="text-center p-2">Cantidad</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td class="text-center" colspan="2">No hay datos en este rango</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div class="col-sm-6 col-md-12">
                                        <div id="store-report-cards" class="row">
                                            <div class="col-6 col-lg-12">
                                                <div class="card report-card mt-3">
                                                    <div class="card-body  text-center">
                                                        <div class="card-text d-flex align-items-center px-1 px-md-3">
                                                            <p class="fw-bold">DIFERENCIA</p>
                                                            <i class="bi bi-plus-slash-minus icon-md ms-auto"></i>
                                                        </div>
                                                        <div>
                                                            <p id="difference-text" class="general-report-cant text-muted">-</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6 col-lg-12">
                                                <div class="card report-card mt-3">
                                                    <div class="card-body  text-center">
                                                        <div class="card-text d-flex align-items-center px-1 px-md-3">
                                                            <p class="fw-bold">CONFIABILIDAD</p>
                                                            <i class="bi bi-activity icon-md ms-auto"></i>
                                                        </div>
                                                        <div>
                                                            <p id="reliability-text" class="general-report-cant text-muted">-</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="graphic-container" class="col-lg-9">
                                <div id="graphic-report-container" class="h-100 d-flex align-items-center justify-content-center p-4">
                                    
                                </div>
                            </div>
                        </div>
                    </div> 
                </section>

                <!-- SECCIÓN DE FILTROS POR ALMACÉN -->
                <section id="store-report-filter" class="mb-0 mt-1">
                    <div id="store-report-filter-container" class="container pt-4 pb-3">
                        <form id="store-filter-form" class="px-2" autocomplete="off">
                            <div class="row">
                                <div class="col-6 col-md-7 col-lg-9 d-flex align-items-center">
                                    <h5 class="fw-bold">Listado por Almacenes</h5>
                                </div>
                                <div class="col-6 col-md-5 col-lg-3 d-flex align-items-center label-over-border">
                                    <label for="store-filter" class="form-label m-2">Filtrar por Almacén</label>
                                    <select class="form-select" id="store-filter" form="general-filter-form">
                                        <option value="0">Todos</option>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- SECCIÓN DE REPORTE POR ALMACÉN -->
                <section id="store-reports" class="mt-0">
                    <div class="container table-responsive p-0">
                        <table id="store-report-table" class="table table-hover align-middle">
                            <thead>
                                <tr class="table-secondary">
                                    <th class="p-3 ps-4">SEMANA</th>
                                    <th class="p-3">PRODUCTO</th>
                                    <th class="text-center p-3">ALMACÉN</th>
                                    <th class="text-center p-3">CONTEO</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="text-center" colspan="8">No hay conteos registrados</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/modules/inventory/pages/reports.js"></script>
</body>
</html>
