<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de inventario - Pallets Alfa App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-1 mb-0">
                    <div id="header-container" class="container px-2 py-3">
                        <h2 class="fw-bold">Gestión de inventario</h2>
                    </div>
                </section>

                <!-- SECCIÓN DE CARDS RESUMEN -->
                <section id="inventory-resume">
                    <div class="container">
                        <div id="inventory-resume-container" class="row row-cols-1 row-cols-md-2">
                            <div class="col-6 col-lg-3">
                                <a href="/app/catalog/products.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold text-muted">PRODUCTOS</p>
                                            <i class="bi bi-clipboard-check icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="products-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold text-muted">DIFERENCIA</p>
                                            <i class="bi bi-plus-slash-minus icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="difference-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold text-muted">CONFIABILIDAD</p>
                                            <i class="bi bi-activity icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="reliability-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                            <div class="col-6 col-lg-3">
                                <a href="./attendance.html" class="card resume-card mt-2 text-decoration-none">
                                    <div class="card-body">
                                        <div class="d-flex align-items-center px-1 px-md-3">
                                            <p class="fw-bold text-muted">SEMANA</p>
                                            <i class="bi bi-calendar2-date icon-md ms-auto"></i>
                                        </div>
                                        <div class="card-text ms-3">
                                            <p id="week-text" class="general-report-cant text-muted">-</p>
                                        </div>
                                    </div>
                                </a>
                            </div>            
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE ESTADISTICAS GENERALES -->
                <section id="inventory-statistics">
                    <div class="container">
                        <div id="inventory-statistics-container" class="row">
                            <div id="reliability-report-container" class="col">
                                <div class="card report-card mt-3">
                                    <div class="card-body d-flex align-items-center justify-content-center text-center">
                                        <div class="card-text">
                                            <p class="fw-bold">Estadísticas de inventario</p>
                                        </div>
                                    </div>
                                    <div class="graphic-report-container">
                                        <div id="graphic-reliability-container" class="h-100 d-flex align-items-center justify-content-center px-4 pt-2 pb-3">
                                            aa
                                        </div>
                                    </div>
                                </div>    
                            </div>
                        </div>
                    </div> 
                </section>

                <!-- SECCIÓN DE ACCESOS DIRECTOS -->
                <section id="direct-access" class="pb-5">
                    <div class="container">
                        <h4>Accesos directos</h4>
                        <div id="direct-access-container" class="row row-cols-1 row-cols-md-2 row-cols-md-3 g-2 mt-2">
                            <div class="col col-md-6 col-lg-4">
                                <a href="./movements.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="movements-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-arrow-left-right icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar movimientos</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./counts.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="counts-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-list-check icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Gestionar conteos físicos</p>
                                    </div>
                                </a>
                            </div>
                            <div class="col col-md-6 col-lg-4">
                                <a href="./reports.html" class="card access-card mt-2 text-decoration-none">
                                    <div id="reports-access" class="card-body d-flex align-items-center">
                                        <div class="icon-square me-3">
                                            <i class="bi bi-clipboard-data icon-lg"></i>
                                        </div>
                                        <p class="fw-bold">Generar reportes</p>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/modules/inventory/pages/inventory.js"></script>
</body>
</html>
