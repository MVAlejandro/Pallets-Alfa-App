<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil - Pallets Alfa App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE LA INFORMACIÓN -->
                <section id="main-content" class="pt-3 pb-4">
                    <div id="main-container" class="container">

                        <!-- ENCABEZADO DEL PERFIL -->
                        <div id="profile-header" class="row p-4">
                            <div class="col d-flex">
                                <div id="picture" class="p-2 border">
                                    <img id="profile-picture" src="../api/storage/employees/profile.jpg" alt="Foto de perfil por defecto" width="100px">
                                </div>
                                <div class="ps-4 d-flex align-items-center">
                                    <div id="profile-card">
                                        <h5 id="user-name" class="fw-bold">User Name</h5>
                                        <p class="small pt-2">
                                            <span id="user-role" class="user-color greenL">User Role</span>
                                            <span id="user-id" class="user-color grey">User ID</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CONTENIDO DEL PERFIL -->
                        <div id="profile-info" class="row">
                            <!-- INFORMACIÓN DE LA CUENTA -->
                            <div class="col-md-6 col-lg-8 px-0 pe-md-2 mt-4">
                                <div id="user-info" class="p-3 h-100 d-flex flex-column">
                                    <div class="border-bottom d-flex align-items-center pb-1">
                                        <i class="bi bi-person"></i>
                                        <p class="ps-2 fw-bold">Información de la Cuenta</p>
                                    </div>
                                    <form id="user-info-form" class="pt-2 pt-lg-4 pb-0 pb-lg-3 flex-grow-1 d-flex flex-column" autocomplete="off">
                                        <div class="row ms-2 me-2 pt-3 pb-2">
                                            <div class="col-lg-6 label-over-border mb-4 mb-lg-0">
                                                <label for="info-fname" class="form-label m-2">Nombre</label>
                                                <input type="text" class="form-control" id="info-fname">
                                                <p class="error invalid-feedback" id="error-info-fname" style="color: red;"></p>
                                            </div>
                                            <div class="col-lg-6 label-over-border">
                                                <label for="info-sname" class="form-label m-2">Apellido(s)</label>
                                                <input type="text" class="form-control" id="info-sname">
                                                <p class="error invalid-feedback" id="error-info-sname" style="color: red;"></p>
                                            </div>
                                        </div>
                                        <div class="row ms-2 me-2 pt-3 pb-2">
                                            <div class="col-lg-6 label-over-border mb-4 mb-lg-0">
                                                <label for="info-email" class="form-label m-2">Correo electrónico</label>
                                                <input type="email" class="form-control" id="info-email">
                                                <p class="error invalid-feedback" id="error-info-email" style="color: red;"></p>
                                            </div>
                                            <div class="col-lg-6 label-over-border">
                                                <label for="info-role" class="form-label m-2">Rol asignado</label>
                                                <input type="text" class="form-control" id="info-role" disabled>
                                                <p class="error invalid-feedback" id="error-info-role" style="color: red;"></p>
                                            </div>
                                        </div>
                                        <div class="d-flex justify-content-end mt-auto me-3 pe-1 pt-2 pt-md-0">
                                            <button type="submit" id="save-btn" class="btn btn-primary">Guardar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- DETALLES DE LA CUENTA -->
                            <div class="col-md-6 col-lg-4 px-0 ps-md-2 mt-4">
                                <div id="user-activity" class="p-3">
                                    <div class="border-bottom d-flex align-items-center pb-1">
                                        <i class="bi bi-clock"></i>
                                        <p class="ps-2 fw-bold">Actividad</p>
                                    </div>
                                    <div class="activity-card px-4 py-3 my-4">
                                        <p class="fw-bold">Fecha de Creación</p>
                                        <small id="activity-date">El usuario fue creado el ----/--/--</small>
                                    </div>
                                    <div class="activity-card px-4 py-3 my-4">
                                        <p class="fw-bold">Historial</p>
                                        <small id="activity-last">La última modificación fue el ----/--/--</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/pages/profile.js"></script>
</body>
</html>
