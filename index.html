<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pallets Alfa App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    
    <!-- BARRA DE RELLENO SUPERIOR -->
    <header id="top-navbar" class="navbar sticky-top flex-md-nowrap p-0">
        
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="container-fluid">
        <div class="row">
            <!-- BARRA DE NAVEGACIÓN -->
            <nav id="side-navbar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 px-lg-5">

                <!-- SECCIÓN DE ENCABEZADO -->
                <section id="site-header" class="pt-3 pb-4">
                    <div id="header-container" class="container px-4 py-3">
                        <h2 class="fw-bold">Hola, <span id="header-user">-</span></h2>
                        <div id="header-body" class="row">
                            <div class="col-lg-10 d-flex align-items-center">
                                <i class="bi bi-calendar2-date"></i>
                                <p id="header-date" class="ps-2">El día de hoy: --/--/----</p>
                            </div>
                            <div class="col-lg-2 d-flex">
                                <h5 id="header-week" class="fw-bold ms-auto">Semana -</h5>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE ACCESOS DIRECTOS -->
                <section id="direct-access-menu" class="pb-4">
                    <div id="menu-container" class="container">
                        <h5 class="ps-lg-2 pb-3">Seleccione un módulo</h5>
                        <div id="direct-access-container" class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">
                            
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN DE AVISOS -->
                <section id="advices">
                    <div id="advices-container" class="container">
                        <h5 class="ps-lg-2 pb-3">Avisos recientes</h5>
                        <div id="advices-cards-container" class="row g-4">
                            
                        </div>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer id="site-footer" class="container-fluid mt-auto">
                    
                </footer>

            </main>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/modules/index/main.js"></script>
</body>
</html>
